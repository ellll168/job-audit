# 一条命令启动数据库 + 后端： docker compose up -d
# 首次启动会构建镜像并执行 Flyway 迁移，之后访问 http://localhost:8080/api/health
name: job-audit

services:
  mysql:
    image: mysql:8.0
    container_name: job-audit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-jobaudit}
      MYSQL_DATABASE: job_audit_db
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    container_name: job-audit-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-jobaudit}
      # 没有配置真实 Key 时使用占位值：服务仍可启动，AI 相关功能会走降级提示
      LLM_API_KEY: ${LLM_API_KEY:-sk-placeholder}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/job_audit_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"

volumes:
  mysql_data:
