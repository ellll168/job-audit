# 测试专用配置：H2 内存库（MySQL 兼容模式），不依赖本机 MySQL
# 执行 mvn test 时通过 @ActiveProfiles("test") 生效
spring.datasource.url=jdbc:h2:mem:job_audit_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# MySQL 迁移脚本里的 ENGINE/CHARSET/COMMENT 是 MySQL 专有语法，H2 无法执行，
# 因此测试库关闭 Flyway，改用 schema-test.sql（两份 DDL 结构保持一致）。
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
