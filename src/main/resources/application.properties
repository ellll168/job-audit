spring.application.name=job-audit

spring.datasource.url=jdbc:mysql://localhost:3306/job_audit_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
# 密码从环境变量读取；默认值仅用于 Docker compose 内部网络，不含任何真实凭据
spring.datasource.password=${DB_PASSWORD:jobaudit}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

logging.pattern.level=%5p [%X{traceId}]


langchain4j.open-ai.chat-model.api-key=${LLM_API_KEY}
langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com/v1
langchain4j.open-ai.chat-model.model-name=deepseek-chat
# deepseek-chat 不支持 json_schema，结构化约束改由 Prompt + 服务端校验保证，无需 strict-json-schema
# 关闭请求/响应日志：JD 原文属用户输入，不能落进日志
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false

# Knife4j / OpenAPI 文档：http://localhost:8080/doc.html
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
knife4j.enable=true